name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  collector:
    uses: locktivity/epack/.github/workflows/collector-ci.yaml@0230915f198796725c1468b8e41694de14f168df # v0.12.2
    with:
      name: aws
      # The test kit runs past 10 minutes under the race detector.
      test-timeout: 30m
      profile-url: ${{ vars.EVIDENCE_PROFILE_URL }}
      conformance-secrets: AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_ID_TOKEN_REQUEST_TOKEN
      checks: |
        ./scripts/check-forbidden-apis.sh
