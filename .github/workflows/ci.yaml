name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  collector:
    uses: locktivity/epack/.github/workflows/collector-ci.yaml@417b9cd23368033b4e7d803b35289e544db7d2a4 # v0.9.7
    with:
      name: aws
      profile-url: ${{ vars.EVIDENCE_PROFILE_URL }}
      conformance-secrets: AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_ID_TOKEN_REQUEST_TOKEN
      checks: |
        ./scripts/check-forbidden-apis.sh
