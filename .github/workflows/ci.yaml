name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  collector:
    uses: locktivity/epack/.github/workflows/collector-ci.yaml@772fa238f4dc4de6b7083328bc786ec1f138e6e6 # v0.9.4
    with:
      name: aws
      profile-url: ${{ vars.EVIDENCE_PROFILE_URL }}
      conformance-secrets: AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_ID_TOKEN_REQUEST_TOKEN
      checks: |
        ./scripts/check-forbidden-apis.sh
